# Полный запуск стека одной командой: Postgres + API(Bun) + Web(Nginx).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: splitch
      POSTGRES_PASSWORD: splitch
      POSTGRES_DB: splitch
    ports:
      - "5432:5432"
    volumes:
      - splitch_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitch -d splitch"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://splitch:splitch@postgres:5432/splitch
      CHECK_VERIFY_URL: ${CHECK_VERIFY_URL:-https://proverka-cheka.online/process.php}
      CORS_ORIGIN: http://localhost:8080
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun -e \"fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  splitch_pg:
